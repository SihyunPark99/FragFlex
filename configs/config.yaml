defaults:
  - _self_
  - general: paper_single_gpu
  - model: fragflex_paper
  - train: paper_single_gpu
  - dataset: fragflex

# Hydra creates one output directory per run and changes into it before training.
hydra:
  job:
    chdir: true
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}-${general.name}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}-${general.name}
